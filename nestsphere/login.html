<!DOCTYPE html>
<html lang="en"><head><title>NestSphere - Login</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col auth-page text-on-surface antialiased">
<div id="site-header"></div>
<main class="flex-1 flex items-center justify-center px-4 sm:px-6 py-8">
  <div class="auth-shell w-full max-w-5xl rounded-3xl overflow-hidden grid grid-cols-1 md:grid-cols-12">
    <div class="md:col-span-7 p-6 sm:p-10 lg:p-12 neu-panel rounded-none m-3 md:m-0 md:rounded-l-3xl md:rounded-r-none">
      <div class="max-w-md mx-auto">
        <h1 class="font-display text-3xl font-bold text-primary">Agent &amp; User Login</h1>
        <p class="text-sm text-on-surface-variant mt-1.5 mb-6">Enter your credentials to access properties, escrow milestones, and projects.</p>
        <div class="p-1 bg-surface-low rounded-xl flex gap-1 mb-6 neu-panel">
          <button type="button" data-role="homeowner" class="role-tab neu-tab active flex-1 py-2.5 px-2 rounded-lg text-xs sm:text-sm font-bold">Homeowner / Buyer</button>
          <button type="button" data-role="pro" class="role-tab neu-tab flex-1 py-2.5 px-2 rounded-lg text-xs sm:text-sm font-semibold">NCA Pro / Partner</button>
        </div>
        <form id="login-form" class="space-y-4">
          <div class="space-y-1.5">
            <label for="identifier" class="block text-xs font-medium text-on-surface-variant">Email address</label>
            <div class="relative"><span class="material-symbols-outlined absolute left-3.5 top-3 text-on-surface-variant text-[20px]">mail</span>
              <input id="identifier" type="email" required placeholder="e.g. kelvin@example.com" class="neu-input w-full h-12 pl-11 pr-4 rounded-xl focus:border-primary-container focus:ring-0"></div>
          </div>
          <div class="space-y-1.5">
            <div class="flex justify-between"><label for="password" class="text-xs font-medium text-on-surface-variant">Password</label>
              <a href="#" class="text-xs font-semibold text-secondary hover:underline">Forgot password?</a></div>
            <div class="relative"><span class="material-symbols-outlined absolute left-3.5 top-3 text-on-surface-variant text-[20px]">lock</span>
              <input id="password" type="password" required placeholder="••••••••" class="neu-input w-full h-12 pl-11 pr-11 rounded-xl focus:border-primary-container focus:ring-0">
              <button type="button" id="toggle-pw" aria-label="Show password" class="absolute right-3.5 top-3 text-on-surface-variant"><span id="toggle-pw-icon" class="material-symbols-outlined text-[20px]">visibility</span></button></div>
          </div>
          <label class="flex items-center gap-2.5 text-sm text-on-surface-variant"><input type="checkbox" checked class="rounded text-primary-container"> Remember this device</label>
          <button id="submit-btn" type="submit" class="neu-button w-full min-h-[48px] rounded-xl text-primary font-semibold flex items-center justify-center gap-2 disabled:opacity-70">
            <span id="btn-label">Sign in</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button>
        </form>
        <p class="text-center text-sm text-on-surface-variant mt-6 pt-6 border-t border-surface-container">New to NestSphere?
          <a href="register.html" class="font-bold text-primary hover:underline">Create an account</a></p>
      </div>
    </div>
    <div class="md:col-span-5 relative min-h-[260px] md:min-h-full flex items-end p-5 sm:p-8 overflow-hidden neu-panel md:rounded-r-3xl md:rounded-l-none rounded-b-3xl m-3 md:m-0">
      <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3JkXcjKUa-fD6NIcGKGPEjwZLjZ_1eIuQAK3azyrb25mQvDmGWG6mPaYWYLxx1B7-ESdcYVPJNkSlicQD0DusEcSufDozNp9nCr7HPI2PACnJS9HwjsTE3RP745preKOTaYzkgaVMqsRYiorjLEb0g2DHTYBxh4UVbwG8epRpgGN4FQoqpI9OtakCitrr93oy250OOwmfmUbAEn1tKhsiCUyLdR6NVRJyDI50_9k8yPNPgPRi5BV_xFOOgH_zrPZLLw" alt="The Azure Sanctuary" class="absolute inset-0 w-full h-full object-cover rounded-2xl">
      <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/35 to-black/10 rounded-2xl"></div>
      <div class="relative w-full p-5 rounded-2xl bg-white/90 backdrop-blur-md space-y-2">
        <span class="text-xs font-bold text-secondary">Featured verified estate</span>
        <h3 class="font-display text-xl font-bold text-primary">The Azure Sanctuary, Karen</h3>
        <p class="text-sm text-on-surface-variant">Smart escrow enabled • NCA verified contractor • Ready for diaspora inspection</p>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/layout.js"></script><script src="js/auth-config.js"></script><script src="js/login.js"></script>
</body></html>
